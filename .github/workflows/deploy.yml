name: Deploy to GitHub Pages

# This workflow BUILDS your Astro site and publishes it to the `gh-pages`
# branch automatically on every push to `main`.
#
# GitHub requires GitHub Pages to be enabled ONCE by an account owner (the
# API rejects an auto-enable with HTTP 403, so we do that one click manually).
# After that single click, this branch serves your site fully automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # publish the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./dist
          publish_branch: gh-pages
