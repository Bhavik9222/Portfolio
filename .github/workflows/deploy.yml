name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write -> publish the gh-pages branch
# pages: write    -> enable GitHub Pages via the API
# id-token: write -> OIDC token required by the Pages API
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Publish build output to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./dist

      - name: Enable GitHub Pages
        run: |
          echo "Enabling GitHub Pages via API..."
          curl -fL -s -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source": {"branch": "gh-pages", "path": "/"}}'
          echo "GitHub Pages enable request finished."
