name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: npm ci
        id: npmci
        run: |
          echo "=== running npm ci ==="
          npm ci
          echo "=== npm ci done ==="

      - name: npm run build
        id: build
        run: |
          echo "=== running npm run build ==="
          npm run build
          echo "=== build done ==="
          ls -la dist

      - name: Publish to gh-pages
        id: publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./dist

      - name: Enable GitHub Pages
        id: enable
        run: |
          echo "=== enabling GitHub Pages via API ==="
          resp=$(curl -s -w '\nHTTP:%{http_code}' -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source": {"branch": "gh-pages", "path": "/"}}')
          echo "$resp"
          code=$(echo "$resp" | tail -1 | sed 's/HTTP://')
          if [ "${code:-0}" -ge 400 ] 2>/dev/null; then
            echo "::error::GitHub Pages API rejected enable request (HTTP ${code})"
            exit 1
          fi
          echo "=== GitHub Pages enabled ==="
